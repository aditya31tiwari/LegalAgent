  # --- the remaining 24, added once the real label list was in hand ----------
  # Judgement calls, flagged for review. The ones worth arguing about:
  #   Arbitration          -> dispute_resolution  (clear, and it matters)
  #   Applicable Laws      -> compliance_and_law, NOT governing_law: in LEDGAR
  #                           these are "comply with applicable law" covenants,
  #                           not choice-of-law clauses. Check this against the
  #                           CSV before trusting it.
  #   Base Salary/Benefits -> payment_and_fees: employment-agreement pay. Money
  #                           either way, but a different kind of money.
  # The rest are employment or deal boilerplate with no conflict role, so they
  # fail criterion 1 in labels.yaml and go to `other`.
  "Arbitration":                 [dispute_resolution]
  "Anti-Corruption Laws":        [compliance_and_law]
  "Applicable Laws":             [compliance_and_law]
