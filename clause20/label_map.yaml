# Translation table: source label -> CLAUSE-20 label(s).
#
# One source label may map to several CLAUSE-20 labels (a clause carrying
# "Representations" is warranty, and sometimes compliance_and_law too), which is
# why every value is a list.
#
# unmapped_policy: fail
#   Any source label not listed here stops the build. This is deliberate -- if a
#   source dataset revision adds or renames a label, the build must break rather
#   than silently bin new data into `other`. Run:
#       python clause20/build.py labels
#   to print the exact label strings shipped by the downloaded datasets, then
#   add the missing ones here.

version: 1
unmapped_policy: fail

