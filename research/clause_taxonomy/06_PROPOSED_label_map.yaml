# Translation table: source label -> CLAUSE-22 label(s).
#
# Drop-in replacement for clause20/label_map.yaml.
# Every CUAD (41) and LexGLUE LEDGAR (100) source label is explicitly mapped.
# unmapped_policy: fail ensures no source label silently bins into `other`.
#
# Changes from CLAUSE-20 (v1 -> v2):
#   1. CUAD "Liquidated Damages" moved from [limitation_of_liability] -> [remedies, payment_and_fees]
#      (69 rows; stops polluting limitation_of_liability; dedicated rule in classification.py).
#   2. CUAD "Covenant Not To Sue" moved from [dispute_resolution] -> [remedies].
#   3. CUAD "Third Party Beneficiary" demoted from [compliance_and_law] -> [other].
#   4. LEDGAR "Arbitration" split from [dispute_resolution] -> [arbitration] (445 post-dedup rows).
#   5. LEDGAR "Remedies", "Specific Performance", "Releases" split from
#      [dispute_resolution] -> [remedies] (1,752 LEDGAR post-dedup rows).
#   6. LEDGAR "Applicable Laws" fixed from [compliance_and_law] -> [governing_law]
#      (empirically verified: 89.9% of rows are choice-of-law clauses).
#   7. 10 M&A/credit-closing LEDGAR labels demoted from [compliance_and_law] -> [other]
#      (Authority, Authorizations, Approvals, Binding Effects, Enforceability,
#      No Conflicts, No Defaults, Solvency, Liens, Transactions With Affiliates)
#      to cut 4,967 noise rows from compliance_and_law.

version: 2
unmapped_policy: fail

