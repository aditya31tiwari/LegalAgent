[project]
name = "legalagent"
version = "0.1.0"
description = "Contract clause conflict analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.25",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "scikit-learn>=1.3",
]

[project.scripts]
legalagent = "legalagent.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legalagent*"]
